<!-- «+»: три карточки над меню (выбор) → отдельный экран с формой раздела. Значения: src/views/add-entry.js -->
<sc-if value="{{sheetPicking}}">
  <div class="pick-backdrop fade-in" onClick="{{closeAddSheet}}"></div>
  <div class="pick-float" role="dialog" aria-label="Что добавить">
    <div class="pick-head">
      <span class="pick-caption">Что добавить?</span>
      <sc-if value="{{hasDraft}}">
        <span class="pick-actions">
          <button class="pick-clear" onClick="{{discardDraft}}">Очистить</button>
          <button class="pick-save" onClick="{{save}}">Сохранить</button>
        </span>
      </sc-if>
    </div>
    <div class="pick-slider scroller">
      <sc-for list="{{pickCards}}" as="c">
        <button class="{{c.cls}}" onClick="{{c.pick}}">
          <span class="{{c.iconCls}}" aria-hidden="true">
            <sc-if value="{{c.isStool}}"><sc-component name="Pebble" type="4" size="24"></sc-component></sc-if>
            <sc-if value="{{c.isFood}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="7"></circle><circle cx="12" cy="13" r="3.5"></circle><path d="M4 4v5M20 4v5"></path></svg></sc-if>
            <sc-if value="{{c.isWater}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M12 3c3 4.2 6 7.6 6 11a6 6 0 0 1-12 0c0-3.4 3-6.8 6-11z"></path></svg></sc-if>
          </span>
          <span class="pick-text">
            <span class="pick-title">{{c.title}}<sc-if value="{{c.filled}}"><span class="pick-dot" aria-label="заполнено"></span></sc-if></span>
            <span class="pick-sub">{{c.sub}}</span>
          </span>
        </button>
      </sc-for>
    </div>
  </div>
</sc-if>

<sc-if value="{{sheetForm}}">
  <section class="add-screen screen-in" role="dialog" aria-label="Новая запись">
    <div class="sheet-head add-sheet-head">
      <button class="icon-btn sheet-back" onClick="{{backToPicker}}" aria-label="К выбору раздела"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></button>
      <div class="add-sheet-titles">
        <div class="add-sheet-title">{{sheetTitle}}</div>
        <div class="hint">{{dateLong}}</div>
      </div>
      <button class="icon-btn" onClick="{{closeAddSheet}}" aria-label="Закрыть"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>
    <div class="add-screen-body">
      <sc-include name="add"></sc-include>
    </div>
  </section>
</sc-if>
