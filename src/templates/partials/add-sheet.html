<!-- «+»: экран «Запись» (из меню) или модалка одного раздела (из плитки на главной). Значения: src/views/add-entry.js -->
<sc-if value="{{sheetModal}}">
  <div class="qmodal-backdrop fade-in" onClick="{{closeAddSheet}}"></div>
  <div class="qmodal-wrap">
    <section class="qmodal pop-in" role="dialog" aria-label="{{sheetTitle}}">
      <div class="qmodal-head">
        <h1 class="qmodal-title">{{sheetTitle}}</h1>
        <button class="icon-btn" onClick="{{closeAddSheet}}" aria-label="Закрыть"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </div>
      <sc-if value="{{sec.stool}}"><sc-include name="add-carousel"></sc-include></sc-if>
      <sc-if value="{{sec.food}}"><div class="qmodal-food"><sc-include name="add-food"></sc-include></div></sc-if>
      <sc-if value="{{sec.water}}"><div class="gcard g-sage gblock"><sc-include name="add-cups"></sc-include></div></sc-if>
      <button class="btn" onClick="{{save}}">{{modalCta}}</button>
    </section>
  </div>
</sc-if>

<sc-if value="{{sheetAll}}">
  <section class="add-screen screen-in" role="dialog" aria-label="Новая запись">
    <div class="sheet-head add-sheet-head">
      <span class="add-head-spacer"></span>
      <div class="add-sheet-titles">
        <div class="add-sheet-title">Запись</div>
        <div class="hint">{{dateLong}}</div>
      </div>
      <button class="icon-btn" onClick="{{closeAddSheet}}" aria-label="Закрыть"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>
    <div class="add-screen-body">
      <sc-include name="add"></sc-include>
    </div>
  </section>
</sc-if>
