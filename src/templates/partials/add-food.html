<!-- Еда: фото или описание текстом → ИИ разбирает → КБЖУ; можно уточнить. Значения: src/views/add-entry.js -->
<sc-if value="{{food.pick}}">
  <sc-if value="{{photo}}">
    <div class="photo-preview">
      <img src="{{photo}}" alt="Фото блюда">
      <button class="icon-btn small on-photo" onClick="{{removePhoto}}" aria-label="Убрать фото"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>
  </sc-if>
  <!-- фото — маленькая кнопка слева от поля, описание — само поле -->
  <div class="food-row">
    <sc-if value="{{noPhoto}}">
      <label class="food-cam" for="foodFile" aria-label="{{photoLabel}}">
        <sc-if value="{{photoCamera}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></sc-if>
        <sc-if value="{{photoGallery}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="14" rx="2"></rect><circle cx="9" cy="10" r="1.5"></circle><path d="M20 16l-5-5-8 8"></path></svg></sc-if>
        <input id="foodFile" class="file-input" type="file" accept="image/*" onChange="{{onPhoto}}">
      </label>
    </sc-if>
    <label class="sr-only" for="foodNote">Описание блюда</label>
    <input id="foodNote" class="field-input food-note" type="text" enterkeyhint="done" placeholder="Опишите блюдо" value="{{note}}" onChange="{{onNote}}">
  </div>
</sc-if>

<sc-if value="{{food.scan}}">
  <div class="scan" style="background: {{scanTint}}">
    <sc-if value="{{photo}}"><img src="{{photo}}" alt="Фото блюда"></sc-if>
    <div class="scan-line"></div>
  </div>
  <div class="scan-text">ИИ считает КБЖУ…</div>
</sc-if>

<sc-if value="{{food.done}}">
  <div class="fade-in">
    <sc-include name="meal-card"></sc-include>
  </div>
  <sc-if value="{{fixClosed}}">
    <div class="meal-actions">
      <button class="text-link" onClick="{{openFix}}">Уточнить</button>
      <button class="text-link" onClick="{{removeFood}}">Убрать</button>
    </div>
  </sc-if>
  <sc-if value="{{fixOpen}}">
    <label class="sr-only" for="foodFix">Уточнение</label>
    <textarea id="foodFix" class="field-input area" rows="2" placeholder="Что поправить?" onChange="{{onFix}}">{{fix}}</textarea>
    <button class="{{fixCls}}" onClick="{{applyFix}}">{{fixLabel}}</button>
  </sc-if>
</sc-if>
