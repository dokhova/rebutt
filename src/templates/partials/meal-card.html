<!-- Карточка блюда. Значения: card из src/views/meal-card.js -->
<div class="meal-card">
  <sc-if value="{{card.hasPhoto}}">
    <div class="meal-photo">
      <img src="{{card.photo}}" alt="{{card.name}}">
      <sc-if value="{{card.aiArt}}"><span class="meal-photo-tag">Картинка ИИ</span></sc-if>
    </div>
  </sc-if>
  <sc-if value="{{card.drawing}}">
    <div class="meal-photo drawing" style="background: {{card.tint}}"><span class="meal-photo-tag">ИИ рисует картинку…</span></div>
  </sc-if>
  <div class="meal-head">
    <sc-if value="{{card.showThumb}}"><span class="thumb lg" style="background: {{card.tint}}"></span></sc-if>
    <div class="meal-info">
      <div class="meal-name">{{card.name}}</div>
      <div class="meal-verdict">{{card.verdict}}</div>
    </div>
  </div>
  <div class="macros">
    <sc-for list="{{card.stats}}" as="m"><div class="macro"><div class="macro-value num">{{m.value}}</div><div class="macro-label">{{m.label}}</div></div></sc-for>
  </div>
  <sc-if value="{{card.tip}}"><div class="meal-tip">{{card.tip}}</div></sc-if>
</div>
