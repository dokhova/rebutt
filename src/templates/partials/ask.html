<!-- Блок «Спросить ИИ». Значения: src/views/ask.js. Используется на «Сегодня» и в «Инсайтах». -->
<div class="section">
  <div class="caption">Спросить ИИ</div>
  <div class="chips">
    <sc-for list="{{suggestions}}" as="s"><button class="chip" onClick="{{s.pick}}">{{s.q}}</button></sc-for>
  </div>
  <sc-if value="{{hasChat}}">
    <div class="chat fade-in">
      <div class="bubble-q">{{question}}</div>
      <div class="{{answerCls}}">{{answer}}</div>
      <div class="hint chat-note">Ответ ИИ не заменяет консультацию врача</div>
    </div>
  </sc-if>
  <div class="ask">
    <label class="sr-only" for="askInput">Вопрос ИИ</label>
    <input id="askInput" class="ask-input" type="text" placeholder="Свой вопрос…" value="{{askText}}" onChange="{{onAskInput}}">
    <button class="plus" onClick="{{sendAsk}}" aria-label="Отправить"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
  </div>
</div>
