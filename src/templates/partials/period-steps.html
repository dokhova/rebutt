<!-- «Месячные идут сейчас?» → день / когда начались. Значения: src/views/period-steps.js -->
<div class="ps-q">Месячные идут сейчас?</div>
<div class="{{psSegsCls}}"><button class="{{nowYes}}" onClick="{{pickNowYes}}">Да</button><button class="{{nowNo}}" onClick="{{pickNowNo}}">Нет</button></div>
<sc-if value="{{askDay}}">
  <div class="ps-q fade-in">Какой сейчас день?</div>
  <div class="chips"><sc-for list="{{nowDays}}" as="d"><button class="{{d.cls}}" aria-pressed="{{d.on}}" onClick="{{d.pick}}">{{d.label}}</button></sc-for></div>
</sc-if>
<sc-if value="{{askAgo}}">
  <div class="ps-q fade-in">Когда начались последние?</div>
  <div class="chips"><sc-for list="{{agoOptions}}" as="o"><button class="{{o.cls}}" aria-pressed="{{o.on}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for></div>
  <div class="hint">{{periodHint}}</div>
</sc-if>
