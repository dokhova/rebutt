<!-- Иллюстрация кишечника. Props: tone (calm | mild | sens | cycle | empty | onb | onbcycle), size (px) -->
<div class="gut" style="width: {{size}}px; height: {{size}}px">
  <div class="gut-glow" style="background: {{glow}}; filter: blur({{blur}}px)"></div>
  <img class="gut-img" src="{{src}}" alt="">
</div>
