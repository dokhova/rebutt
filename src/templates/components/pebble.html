<!-- Иконка типа стула. Props: type (1–7), size (px). Показывается одна группа t1…t7. -->
<div class="pebble" style="width: {{size}}px; height: {{size}}px">
<svg viewBox="0 0 160 160" width="100%" height="100%" aria-hidden="true">
<defs>
<radialGradient id="pbStone" cx="0.36" cy="0.28" r="0.85">
<stop offset="0" stop-color="#F3EEE5"></stop>
<stop offset="0.45" stop-color="#BDB4A3"></stop>
<stop offset="1" stop-color="#6A6356"></stop>
</radialGradient>
<radialGradient id="pbSoft" cx="0.4" cy="0.3" r="0.8">
<stop offset="0" stop-color="#F5F1EA"></stop>
<stop offset="0.6" stop-color="#CEC5B5"></stop>
<stop offset="1" stop-color="#857D6E"></stop>
</radialGradient>
<linearGradient id="pbWater" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#EEE9E0" stop-opacity="0.95"></stop>
<stop offset="1" stop-color="#B5AD9E" stop-opacity="0.85"></stop>
</linearGradient>
<filter id="pbGrain" x="-5%" y="-5%" width="110%" height="110%">
<feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="4" result="noise"></feTurbulence>
<feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.36  0 0 0 0 0.33  0 0 0 0 0.29  0.7 0 0 0 -0.2" result="tint"></feColorMatrix>
<feComposite in="tint" in2="SourceGraphic" operator="in" result="grain"></feComposite>
<feMerge><feMergeNode in="SourceGraphic"></feMergeNode><feMergeNode in="grain"></feMergeNode></feMerge>
</filter>
<filter id="pbBlur" x="-30%" y="-200%" width="160%" height="500%">
<feGaussianBlur stdDeviation="5"></feGaussianBlur>
</filter>
</defs>

<sc-if value="{{t1}}">
<ellipse cx="82" cy="126" rx="56" ry="7" fill="#000000" opacity="0.16" filter="url(#pbBlur)"></ellipse>
<g filter="url(#pbGrain)" fill="url(#pbStone)">
<circle cx="46" cy="96" r="17"></circle>
<circle cx="84" cy="104" r="15"></circle>
<circle cx="118" cy="92" r="18"></circle>
<circle cx="64" cy="66" r="13"></circle>
<circle cx="102" cy="60" r="12"></circle>
</g>
</sc-if>

<sc-if value="{{t2}}">
<ellipse cx="82" cy="118" rx="62" ry="7" fill="#000000" opacity="0.16" filter="url(#pbBlur)"></ellipse>
<g filter="url(#pbGrain)" fill="url(#pbStone)">
<circle cx="34" cy="92" r="19"></circle>
<circle cx="58" cy="83" r="21"></circle>
<circle cx="84" cy="80" r="22"></circle>
<circle cx="109" cy="84" r="21"></circle>
<circle cx="131" cy="94" r="18"></circle>
</g>
</sc-if>

<sc-if value="{{t3}}">
<ellipse cx="80" cy="114" rx="62" ry="7" fill="#000000" opacity="0.16" filter="url(#pbBlur)"></ellipse>
<g transform="rotate(-8 80 81)">
<rect x="16" y="60" width="128" height="42" rx="21" fill="url(#pbStone)" filter="url(#pbGrain)"></rect>
<g fill="none" stroke="#6A6356" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
<path d="M46 62 l4 9 l-3 6"></path>
<path d="M78 60 l-2 9 l4 7"></path>
<path d="M110 61 l3 8 l-2 6"></path>
<path d="M62 101 l2 -7 l-2 -4"></path>
<path d="M96 101 l-3 -7"></path>
</g>
</g>
</sc-if>

<sc-if value="{{t4}}">
<ellipse cx="80" cy="116" rx="64" ry="7" fill="#000000" opacity="0.16" filter="url(#pbBlur)"></ellipse>
<g transform="rotate(-10 80 82)">
<rect x="14" y="62" width="132" height="40" rx="20" fill="url(#pbStone)" filter="url(#pbGrain)"></rect>
<ellipse cx="54" cy="70" rx="24" ry="4" fill="#FFFFFF" opacity="0.45"></ellipse>
</g>
</sc-if>

<sc-if value="{{t5}}">
<ellipse cx="80" cy="120" rx="58" ry="7" fill="#000000" opacity="0.16" filter="url(#pbBlur)"></ellipse>
<g filter="url(#pbGrain)" fill="url(#pbSoft)">
<ellipse cx="52" cy="94" rx="25" ry="18"></ellipse>
<ellipse cx="104" cy="99" rx="27" ry="19"></ellipse>
<ellipse cx="80" cy="62" rx="21" ry="15"></ellipse>
</g>
</sc-if>

<sc-if value="{{t6}}">
<ellipse cx="80" cy="120" rx="60" ry="7" fill="#000000" opacity="0.14" filter="url(#pbBlur)"></ellipse>
<g fill="url(#pbSoft)" filter="url(#pbGrain)">
<circle cx="56" cy="92" r="16"></circle>
<circle cx="74" cy="84" r="14"></circle>
<circle cx="92" cy="90" r="17"></circle>
<circle cx="110" cy="96" r="13"></circle>
<circle cx="66" cy="104" r="12"></circle>
<circle cx="86" cy="106" r="13"></circle>
<circle cx="102" cy="78" r="10"></circle>
<circle cx="44" cy="102" r="9"></circle>
<circle cx="122" cy="104" r="8"></circle>
</g>
<g fill="url(#pbSoft)" opacity="0.8">
<circle cx="30" cy="84" r="5"></circle>
<circle cx="134" cy="84" r="4"></circle>
<circle cx="120" cy="70" r="3.5"></circle>
<circle cx="40" cy="72" r="3"></circle>
</g>
</sc-if>

<sc-if value="{{t7}}">
<ellipse cx="80" cy="118" rx="64" ry="6" fill="#000000" opacity="0.12" filter="url(#pbBlur)"></ellipse>
<path d="M22 104 C30 88 58 94 70 86 C86 76 112 90 128 84 C146 78 148 104 132 110 C112 118 92 108 74 114 C54 120 16 122 22 104 Z" fill="url(#pbWater)"></path>
<ellipse cx="62" cy="96" rx="18" ry="3" fill="#FFFFFF" opacity="0.5"></ellipse>
<ellipse cx="60" cy="60" rx="5" ry="7" fill="url(#pbWater)"></ellipse>
<ellipse cx="98" cy="52" rx="4" ry="6" fill="url(#pbWater)"></ellipse>
<ellipse cx="120" cy="66" rx="3" ry="4.5" fill="url(#pbWater)"></ellipse>
</sc-if>
</svg>
</div>
