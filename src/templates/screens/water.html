<!-- Модалка поверх экрана (partials/edit-modal.html). Правка жидкости за день — стаканами, как при записи через «+». Значения: src/views/water.js -->
<div class="qmodal-head">
  <div class="qmodal-titles"><h1 class="qmodal-title">Жидкость</h1><div class="hint">{{waterWhen}}</div></div>
  <button class="icon-btn" onClick="{{closeWater}}" aria-label="Закрыть"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>

<div class="gcard g-sage gblock">
  <div class="cups">
    <sc-for list="{{weCups}}" as="c">
      <button class="{{c.cls}}" onClick="{{c.tap}}" aria-label="{{c.label}}"><svg width="28" height="34" viewBox="0 0 26 30" aria-hidden="true"><path d="M3 2h20l-2.4 26H5.4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path></svg></button>
    </sc-for>
  </div>
  <div class="cups-foot"><span class="gvalue num">{{weLitres}}<span class="gunit"> {{weOf}}</span></span></div>
  <div class="cups-hint">Вода, чай, кофе, суп — всё считается</div>
</div>

<button class="btn" onClick="{{saveWater}}">Сохранить</button>
<button class="danger-btn" onClick="{{deleteWater}}">Удалить запись</button>
