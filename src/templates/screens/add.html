<!-- «+» Новая запись. Значения: src/views/add-entry.js -->
<div>
  <div class="add-date">{{dateLong}}</div>
  <h1 class="add-title">Как кишечник<br><span class="muted">сегодня?</span></h1>
</div>

<sc-include name="gut-form"></sc-include>

<!-- Цикл -->
<sc-if value="{{cycleEnabled}}">
  <div class="card form-card">
    <div class="card-head"><div class="caption">Цикл</div><sc-if value="{{cycleDayKnown}}"><div class="hint num">день {{cycleDay}}</div></sc-if></div>
    <div class="segments">
      <button class="{{periodNo}}" onClick="{{setPeriodNo}}">Месячных нет</button>
      <button class="{{periodYes}}" onClick="{{setPeriodYes}}">Месячные</button>
    </div>
  </div>
</sc-if>

<!-- Еда: фото и/или описание → ИИ разбирает → КБЖУ; можно уточнить -->
<div class="card form-card">
  <div class="card-head"><div class="caption">Еда</div><div class="hint">по желанию</div></div>

  <sc-if value="{{food.pick}}">
    <sc-if value="{{noPhoto}}">
      <label class="photo-drop" for="foodFile">
        <span class="icon-btn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></span>
        <span>Сфотографировать блюдо</span>
        <input id="foodFile" class="file-input" type="file" accept="image/*" onChange="{{onPhoto}}">
      </label>
    </sc-if>
    <sc-if value="{{photo}}">
      <div class="photo-preview">
        <img src="{{photo}}" alt="Фото блюда">
        <button class="icon-btn small on-photo" onClick="{{removePhoto}}" aria-label="Убрать фото"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </div>
    </sc-if>
    <label class="sr-only" for="foodNote">Описание блюда</label>
    <textarea id="foodNote" class="field-input area" rows="2" placeholder="Что в тарелке? (по желанию)" onChange="{{onNote}}">{{note}}</textarea>
    <button class="{{analyzeCls}}" onClick="{{analyze}}">Разобрать с ИИ</button>
  </sc-if>

  <sc-if value="{{food.scan}}">
    <div class="scan" style="background: {{scanTint}}">
      <sc-if value="{{photo}}"><img src="{{photo}}" alt="Фото блюда"></sc-if>
      <div class="scan-line"></div>
    </div>
    <div class="scan-text">ИИ считает КБЖУ…</div>
  </sc-if>

  <sc-if value="{{food.done}}">
    <div class="fade-in">
      <sc-include name="meal-card"></sc-include>
    </div>
    <sc-if value="{{fixClosed}}">
      <div class="meal-actions">
        <button class="text-link" onClick="{{openFix}}">Уточнить</button>
        <button class="text-link" onClick="{{removeFood}}">Убрать</button>
      </div>
    </sc-if>
    <sc-if value="{{fixOpen}}">
      <label class="sr-only" for="foodFix">Уточнение</label>
      <textarea id="foodFix" class="field-input area" rows="2" placeholder="Что поправить?" onChange="{{onFix}}">{{fix}}</textarea>
      <button class="{{fixCls}}" onClick="{{applyFix}}">{{fixLabel}}</button>
    </sc-if>
  </sc-if>
</div>

<div class="save-bar">
  <div class="preview">
    <span class="muted">Кишечник работает на</span>
    <span class="num"><span class="muted">{{scoreNow}}</span> → <strong>{{scorePreview}}</strong></span>
  </div>
  <button class="btn" onClick="{{save}}">Сохранить</button>
</div>
