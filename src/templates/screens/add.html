<!-- Экран «Запись» («+» в меню): все блоки сразу. Обёртка — partials/add-sheet.html, значения — src/views/add-entry.js -->
<div class="gcard g-moss gblock">
  <div class="gblock-head"><h2 class="gblock-title">Стул</h2><span class="gblock-sub">был сегодня?</span></div>
  <div class="gsegs">
    <button class="{{stoolHadCls}}" onClick="{{setStoolHad}}">Был</button>
    <button class="{{stoolNoneCls}}" onClick="{{setStoolNone}}">Не было</button>
  </div>
  <sc-if value="{{showCarousel}}"><sc-include name="add-carousel"></sc-include></sc-if>
  <div class="gblock-label">Самочувствие</div>
  <div class="chips"><sc-for list="{{symptomChips}}" as="c"><button class="{{c.cls}}" aria-pressed="{{c.on}}" onClick="{{c.pick}}">{{c.label}}</button></sc-for></div>
</div>

<div class="gcard g-lav gblock">
  <div class="gblock-head"><h2 class="gblock-title">Что ещё влияет</h2><span class="gblock-sub">можно пропустить</span></div>
  <div class="grows">
    <sc-if value="{{cycleEnabled}}">
      <div class="grow"><span>Месячные<sc-if value="{{cycleDayKnown}}"><span class="grow-sub num"> · день {{cycleDay}}</span></sc-if></span><button class="{{periodSwitch}}" onClick="{{togglePeriod}}" role="switch" aria-checked="{{periodOn}}" aria-label="Месячные"></button></div>
    </sc-if>
    <div class="grow"><span>Стресс</span><div class="gsegs small"><sc-for list="{{stressLevels}}" as="l"><button class="{{l.cls}}" aria-pressed="{{l.on}}" onClick="{{l.pick}}">{{l.label}}</button></sc-for></div></div>
  </div>
</div>

<div class="gcard g-deep gblock">
  <div class="gblock-head"><h2 class="gblock-title">Еда</h2><span class="gblock-sub">фото или текст</span></div>
  <sc-include name="add-food"></sc-include>
</div>

<div class="gcard g-sage gblock">
  <div class="gblock-head"><h2 class="gblock-title">Жидкость</h2></div>
  <sc-include name="add-cups"></sc-include>
</div>

<div class="save-bar">
  <div class="preview">
    <span class="muted">Кишечник работает на</span>
    <span class="num"><span class="muted">{{scoreNow}}</span> → <strong>{{scorePreview}}</strong></span>
  </div>
  <button class="btn" onClick="{{save}}">Сохранить</button>
</div>
