<!-- «+» Новая запись. Значения: src/views/add-entry.js -->
<div>
  <div class="add-date">{{dateLong}}</div>
  <h1 class="add-title">Как кишечник<br><span class="muted">сегодня?</span></h1>
</div>

<!-- Стул -->
<div class="card form-card">
  <div class="caption">Стул</div>
  <div class="segments">
    <button class="{{stoolHad}}" onClick="{{setHad}}">Был</button>
    <button class="{{stoolNone}}" onClick="{{setNone}}">Не было</button>
  </div>
  <sc-if value="{{showTypes}}">
    <div class="type-list scroller fade-in">
      <sc-for list="{{types}}" as="t">
        <button class="{{t.cls}}" aria-pressed="{{t.on}}" aria-label="{{t.aria}}" onClick="{{t.pick}}">
          <sc-component name="Pebble" type="{{t.type}}" size="60"></sc-component>
          <span class="type-name">Тип {{t.type}}</span><span class="type-desc">{{t.short}}</span>
        </button>
      </sc-for>
    </div>
    <div class="hint">Бристольская шкала: 3–4 — норма</div>
  </sc-if>
</div>

<!-- Самочувствие -->
<div class="card form-card">
  <div class="caption">Самочувствие</div>
  <div class="chips">
    <sc-for list="{{symptoms}}" as="c"><button class="{{c.cls}}" aria-pressed="{{c.on}}" onClick="{{c.pick}}">{{c.label}}</button></sc-for>
  </div>
</div>

<!-- Цикл -->
<sc-if value="{{cycleEnabled}}">
  <div class="card form-card">
    <div class="card-head"><div class="caption">Цикл</div><sc-if value="{{cycleDayKnown}}"><div class="hint num">день {{cycleDay}}</div></sc-if></div>
    <div class="segments">
      <button class="{{periodNo}}" onClick="{{setPeriodNo}}">Месячных нет</button>
      <button class="{{periodYes}}" onClick="{{setPeriodYes}}">Месячные</button>
    </div>
  </div>
</sc-if>

<!-- Еда: фото → ИИ разбирает → результат -->
<div class="card form-card">
  <div class="card-head"><div class="caption">Еда</div><div class="hint">по желанию</div></div>

  <sc-if value="{{food.pick}}">
    <label class="photo-drop" for="foodFile">
      <span class="icon-btn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></span>
      <span>Сфотографировать блюдо</span>
      <input id="foodFile" class="file-input" type="file" accept="image/*" onChange="{{onPhoto}}">
    </label>
    <button class="example-btn" onClick="{{tryExample}}">Попробовать на примере</button>
  </sc-if>

  <sc-if value="{{food.scan}}">
    <div class="scan" style="background: {{meal.tint}}">
      <sc-if value="{{photo}}"><img src="{{photo}}" alt="Фото блюда"></sc-if>
      <div class="scan-line"></div>
    </div>
    <div class="scan-text">ИИ разбирает блюдо…</div>
  </sc-if>

  <sc-if value="{{food.done}}">
    <div class="meal fade-in">
      <div class="meal-head">
        <span class="thumb lg" style="background: {{meal.tint}}"><sc-if value="{{photo}}"><img src="{{photo}}" alt="Фото блюда"></sc-if></span>
        <div class="meal-info">
          <div class="meal-name">{{meal.name}}</div>
          <div class="meal-meta num">{{meal.kcal}} ккал · клетчатка {{meal.fiberText}} г</div>
        </div>
        <button class="icon-btn small" onClick="{{removeFood}}" aria-label="Убрать фото"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </div>
      <div class="meal-verdict"><span class="pill">{{meal.verdict}}</span><span class="meal-tip">{{meal.tip}}</span></div>
    </div>
  </sc-if>
</div>

<div class="save-bar">
  <div class="preview">
    <span class="muted">Кишечник работает на</span>
    <span class="num"><span class="muted">{{scoreNow}}</span> → <strong>{{scorePreview}}</strong></span>
  </div>
  <button class="btn" onClick="{{save}}">Сохранить</button>
</div>
