<!-- «Сегодня». Значения: src/views/today.js -->

<div class="home-head">
  <button class="avatar circle-btn" onClick="{{goProfile}}" aria-label="Профиль"><sc-if value="{{avatarUrl}}"><img src="{{avatarUrl}}" alt=""></sc-if><sc-if value="{{noAvatar}}">{{initial}}</sc-if></button>
  <div class="home-day">
    <div class="home-day-title">{{dayLabel}}</div>
    <div class="home-day-sub">{{dateSub}}</div>
  </div>
  <label class="circle-btn date-btn" aria-label="Выбрать день">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>
    <input class="date-input" type="date" min="{{dateMin}}" max="{{dateMax}}" value="{{dateValue}}" onChange="{{pickDay}}">
  </label>
</div>

<div class="section">
  <h2 class="home-h2">Показатели дня</h2>
  <div class="card metrics">
    <!-- пустой день выглядит так же, как заполненный: вместо цифр тусклый «0»; тап по строке открывает «Стул» -->
    <div class="metric-row" onClick="{{tapGutRow}}">
      <div class="metric">
        <div class="metric-label">Стул</div>
        <div class="{{stool.cls}}">{{stool.text}}<span class="metric-unit">{{stool.unit}}</span></div>
        <div class="mbar" aria-hidden="true"><div class="{{stool.bar.cls}}" style="{{stool.bar.width}}"></div></div>
      </div>
      <div class="metric">
        <div class="metric-label">Форма <button class="info-btn" onClick="{{info.bristol}}" aria-label="Что значит тип стула">?</button></div>
        <div class="{{form.cls}}">{{form.text}}<span class="metric-unit">{{form.unit}}</span></div>
        <div class="mbar" aria-hidden="true"><div class="{{form.bar.cls}}" style="{{form.bar.width}}"></div></div>
      </div>
      <div class="metric">
        <div class="metric-label">Комфорт</div>
        <div class="{{comfort.cls}}">{{comfort.text}}<span class="metric-unit">{{comfort.unit}}</span></div>
        <div class="mbar" aria-hidden="true"><div class="{{comfort.bar.cls}}" style="{{comfort.bar.width}}"></div></div>
      </div>
    </div>
    <div class="metric-tiles">
      <!-- плитка: шапка с «?» и кнопка, которая открывает нужный раздел «+» (кнопки не вкладываются друг в друга) -->
      <div class="metric-tile">
        <div class="metric-tile-head"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21V9M12 13c-3 0-5-2-5-5 3 0 5 2 5 5zM12 13c3 0 5-2 5-5-3 0-5 2-5 5zM12 9c-1.5-1-2-3-1-5 1.5 1 2 3 1 5z"></path></svg><span class="metric-tile-name">Клетчатка</span><button class="info-btn" onClick="{{info.fiber}}" aria-label="Откуда норма клетчатки">?</button></div>
        <button class="metric-tile-body" onClick="{{addFood}}" aria-label="Клетчатка: добавить еду">
          <span class="{{fiber.cls}}">{{fiber.text}}<span class="metric-unit">{{fiber.unit}}</span></span>
          <span class="mbar" aria-hidden="true"><span class="{{fiber.bar.cls}}" style="{{fiber.bar.width}}"></span></span>
        </button>
      </div>
      <div class="metric-tile">
        <div class="metric-tile-head"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c3 4.2 6 7.6 6 11a6 6 0 0 1-12 0c0-3.4 3-6.8 6-11z"></path></svg><span class="metric-tile-name">Жидкость</span><button class="info-btn" onClick="{{info.water}}" aria-label="Откуда норма воды">?</button></div>
        <button class="metric-tile-body" onClick="{{addWater}}" aria-label="Жидкость: добавить">
          <span class="{{water.cls}}">{{water.text}}<span class="metric-unit">{{water.unit}}</span></span>
          <span class="mbar" aria-hidden="true"><span class="{{water.bar.cls}}" style="{{water.bar.width}}"></span></span>
        </button>
      </div>
    </div>
  </div>
</div>

<div class="section">
  <div class="h2-row">
    <h2 class="home-h2">Что может помочь</h2>
    <button class="info-btn" onClick="{{info.tips}}" aria-label="Откуда подсказки">?</button>
  </div>
  <div class="card list">
    <sc-for list="{{tips}}" as="t">
      <div class="row">
        <span class="{{t.tileCls}}" aria-hidden="true">
          <sc-if value="{{t.isWater}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M12 3c3 4.2 6 7.6 6 11a6 6 0 0 1-12 0c0-3.4 3-6.8 6-11z"></path></svg></sc-if>
          <sc-if value="{{t.isFiber}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9M12 13c-3 0-5-2-5-5 3 0 5 2 5 5zM12 13c3 0 5-2 5-5-3 0-5 2-5 5zM12 9c-1.5-1-2-3-1-5 1.5 1 2 3 1 5z"></path></svg></sc-if>
          <sc-if value="{{t.isWalk}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4.5" r="1.5"></circle><path d="M10 21l2-6 3 3v3M8 12l3-4 3 2 3 1M11 8l1 7"></path></svg></sc-if>
          <sc-if value="{{t.isWarm}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 10h12v4a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5zM17 11h1.5a2 2 0 0 1 0 4H17M9 3c-1 1.5 1 2.5 0 4M13 3c-1 1.5 1 2.5 0 4"></path></svg></sc-if>
          <sc-if value="{{t.isCalm}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 9c3-2 5 2 8 0s5-2 8 0M4 15c3-2 5 2 8 0s5-2 8 0"></path></svg></sc-if>
          <sc-if value="{{t.isPhoto}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></sc-if>
          <sc-if value="{{t.isAi}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.9L19 9.7l-5.2 1.8L12 16.4l-1.8-4.9L5 9.7l5.2-1.8z"></path></svg></sc-if>
        </span>
        <div class="row-body"><div class="tip-title">{{t.title}}</div><div class="row-sub wrap">{{t.text}}</div></div>
      </div>
    </sc-for>
  </div>
</div>

<!-- Цикл: только в «окна» (месячные, овуляция, 2 дня до месячных) и одной строкой — domain/cycle.js cycleHint -->
<sc-if value="{{showCycle}}">
  <div class="card cycle-hint"><span class="cycle-hint-title">{{cycle.title}}</span> <span class="muted">· {{cycle.text}}</span></div>
</sc-if>

<sc-if value="{{timeline.length}}">
  <div class="section">
    <h2 class="home-h2">Записи дня</h2>
    <div class="card list">
      <sc-for list="{{timeline}}" as="e">
        <div class="{{e.rowCls}}" onClick="{{e.open}}">
          <sc-if value="{{e.isStool}}"><span class="icon-tile"><sc-component name="Pebble" type="{{e.type}}" size="34"></sc-component></span></sc-if>
          <sc-if value="{{e.isMeal}}"><span class="thumb sm" style="background: {{e.tint}}"><sc-if value="{{e.photo}}"><img src="{{e.photo}}" alt=""></sc-if></span></sc-if>
          <sc-if value="{{e.isFeel}}"><span class="icon-tile"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A8A3B3" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8"></circle><path d="M8 12h8"></path></svg></span></sc-if>
          <sc-if value="{{e.isWater}}"><span class="icon-tile"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A8A3B3" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3c3 4.2 6 7.6 6 11a6 6 0 0 1-12 0c0-3.4 3-6.8 6-11z"></path></svg></span></sc-if>
          <sc-if value="{{e.isPeriod}}"><span class="icon-tile"><svg width="18" height="18" viewBox="0 0 24 24" fill="#A8A3B3"><path d="M12 3c3 4.5 6 8 6 11a6 6 0 0 1-12 0c0-3 3-6.5 6-11z"></path></svg></span></sc-if>
          <div class="row-body"><div class="{{e.titleCls}}">{{e.title}}</div><div class="row-sub nowrap">{{e.sub}}</div></div>
          <div class="row-time num">{{e.time}}</div>
          <sc-if value="{{e.hasOpen}}"><svg class="row-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A8A3B3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></sc-if>
        </div>
      </sc-for>
    </div>
  </div>
</sc-if>
