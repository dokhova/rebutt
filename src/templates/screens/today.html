<!-- «Сегодня». Значения: src/views/today.js -->
<div class="home-head">
  <div>
    <div class="hello">{{hello}}</div>
    <div class="hello-date">{{dateLong}}</div>
  </div>
  <button class="avatar" onClick="{{goProfile}}" aria-label="Профиль">{{initial}}</button>
</div>

<div class="week">
  <sc-for list="{{week}}" as="d">
    <button class="{{d.cls}}" onClick="{{d.pick}}" aria-label="{{d.aria}}"><span class="day-name">{{d.dow}}</span><span class="day-num num">{{d.num}}</span><span class="{{d.dot}}"></span></button>
  </sc-for>
</div>

<sc-if value="{{hasScore}}">
  <div class="hero">
    <div class="hero-gut">
      <sc-component name="Gut" tone="{{gutTone}}" size="260"></sc-component>
      <div class="hero-score">
        <div class="hero-value num">{{idx}}<span class="hero-unit">%</span></div>
        <div class="hero-label nowrap">работа кишечника</div>
      </div>
    </div>
    <div class="hero-sub nowrap">{{heroSub}}</div>
  </div>

  <div class="card rings">
    <sc-for list="{{rings}}" as="r">
      <div class="ring">
        <div class="ring-chart">
          <svg width="76" height="76" viewBox="0 0 88 88" aria-hidden="true"><circle cx="44" cy="44" r="38" fill="none" stroke="#4A4556" stroke-width="7"></circle><circle cx="44" cy="44" r="38" fill="none" stroke="{{r.color}}" stroke-width="7" stroke-linecap="round" stroke-dasharray="{{r.dash}} 300"></circle></svg>
          <div class="ring-value num">{{r.text}}</div>
        </div>
        <div class="ring-label nowrap">{{r.label}}</div>
        <div class="ring-sub nowrap">{{r.sub}}</div>
      </div>
    </sc-for>
  </div>

  <div class="card panel">
    <div class="caption">Совет на сегодня</div>
    <div class="panel-title">{{tip.title}}</div>
    <div class="panel-text">{{tip.text}}</div>
  </div>

  <sc-if value="{{showCycle}}">
    <div class="card panel">
      <div class="caption">Цикл · день {{cycle.day}} из {{cycle.len}}</div>
      <div class="panel-title">{{cycle.phase}}</div>
      <div class="panel-text">{{cycle.note}}</div>
    </div>
  </sc-if>
</sc-if>

<sc-if value="{{noScore}}">
  <div class="empty">
    <div class="empty-art"><sc-component name="Gut" tone="empty" size="220"></sc-component></div>
    <div class="empty-text">За этот день нет записей</div>
  </div>
  <sc-if value="{{isToday}}"><button class="btn" onClick="{{goAddFromEmpty}}">Внести данные за день</button></sc-if>
</sc-if>

<sc-if value="{{timeline.length}}">
  <div class="section">
    <div class="caption">Записи дня</div>
    <div class="card list">
      <sc-for list="{{timeline}}" as="e">
        <div class="row">
          <sc-if value="{{e.isStool}}"><span class="icon-tile"><sc-component name="Pebble" type="{{e.type}}" size="34"></sc-component></span></sc-if>
          <sc-if value="{{e.isMeal}}"><span class="thumb sm" style="background: {{e.tint}}"><sc-if value="{{e.photo}}"><img src="{{e.photo}}" alt=""></sc-if></span></sc-if>
          <sc-if value="{{e.isFeel}}"><span class="icon-tile"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A8A3B3" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8"></circle><path d="M8 12h8"></path></svg></span></sc-if>
          <sc-if value="{{e.isPeriod}}"><span class="icon-tile"><svg width="18" height="18" viewBox="0 0 24 24" fill="#A8A3B3"><path d="M12 3c3 4.5 6 8 6 11a6 6 0 0 1-12 0c0-3 3-6.5 6-11z"></path></svg></span></sc-if>
          <div class="row-body"><div class="row-title nowrap">{{e.title}}</div><div class="row-sub nowrap">{{e.sub}}</div></div>
          <div class="row-time num">{{e.time}}</div>
        </div>
      </sc-for>
    </div>
  </div>
</sc-if>
