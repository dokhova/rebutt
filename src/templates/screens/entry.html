<!-- Модалка поверх экрана (partials/edit-modal.html). Правка записи о стуле — так же, как при записи через «+». Значения: src/views/entry.js, src/views/stool-block.js -->
<div class="qmodal-head">
  <div class="qmodal-titles"><h1 class="qmodal-title">Стул</h1><div class="hint">{{entryWhen}}</div></div>
  <button class="icon-btn" onClick="{{closeEntry}}" aria-label="Закрыть"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>

<div class="gcard g-moss gblock">
  <div class="gsegs">
    <button class="{{stoolHadCls}}" onClick="{{setStoolHad}}">Был</button>
    <button class="{{stoolNoneCls}}" onClick="{{setStoolNone}}">Не было</button>
  </div>
  <sc-if value="{{showCarousel}}"><sc-include name="add-carousel"></sc-include></sc-if>
  <div class="gblock-label">Самочувствие</div>
  <div class="chips"><sc-for list="{{symptomChips}}" as="c"><button class="{{c.cls}}" aria-pressed="{{c.on}}" onClick="{{c.pick}}">{{c.label}}</button></sc-for></div>
</div>

<div class="gcard g-lav gblock">
  <div class="grows"><div class="grow"><span>Стресс</span><div class="gsegs small"><sc-for list="{{stressLevels}}" as="l"><button class="{{l.cls}}" aria-pressed="{{l.on}}" onClick="{{l.pick}}">{{l.label}}</button></sc-for></div></div></div>
</div>

<button class="btn" onClick="{{saveEntry}}">Сохранить</button>
<button class="danger-btn" onClick="{{deleteEntry}}">Удалить запись</button>
