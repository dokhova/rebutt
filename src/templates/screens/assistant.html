<!-- ИИ-помощник: панель снизу поверх экрана. Значения: src/views/assistant.js -->
<div class="sheet-backdrop fade-in" onClick="{{closeAssistant}}"></div>
<section class="sheet slide-up" role="dialog" aria-label="ИИ-помощник">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <div class="sheet-title">ИИ-помощник</div>
    <button class="icon-btn" onClick="{{closeAssistant}}" aria-label="Закрыть"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
  </div>

  <div class="sheet-body">
    <sc-if value="{{emptyChat}}">
      <div class="hint">Спросите про еду, стул или самочувствие — отвечу с учётом ваших записей. Можно приложить фото.</div>
      <div class="chips">
        <sc-for list="{{suggestions}}" as="s"><button class="chip" onClick="{{s.pick}}">{{s.q}}</button></sc-for>
      </div>
    </sc-if>
    <div class="chat">
      <sc-for list="{{messages}}" as="m">
        <div class="{{m.cls}}">
          <sc-if value="{{m.hasImage}}"><img class="chat-img" src="{{m.image}}" alt="Фото к вопросу"></sc-if>
          <sc-if value="{{m.hasText}}"><div>{{m.text}}</div></sc-if>
        </div>
      </sc-for>
      <sc-if value="{{chatLoading}}"><div class="bubble-a typing" aria-label="Пишет ответ"><span></span><span></span><span></span></div></sc-if>
      <span ref="{{scrollChat}}"></span>
    </div>
  </div>

  <div class="sheet-foot">
    <sc-if value="{{hasChatImage}}">
      <div class="chat-attach">
        <img src="{{chatImage}}" alt="Приложенное фото">
        <button class="photo-x" onClick="{{removeChatImage}}" aria-label="Убрать фото"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </div>
    </sc-if>
    <div class="ask">
      <label class="attach-btn" aria-label="Приложить фото">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
        <input id="askFile" class="file-input" type="file" accept="image/*" onChange="{{onChatImage}}">
      </label>
      <!-- Android: камера отдельной кнопкой — системный выбор файла там часто открывает только галерею -->
      <sc-if value="{{showChatCamera}}">
        <label class="attach-btn" aria-label="Сфотографировать">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
          <input id="askCamera" class="file-input" type="file" accept="image/*" capture="environment" onChange="{{onChatImage}}">
        </label>
      </sc-if>
      <label class="sr-only" for="askInput">Вопрос ИИ</label>
      <!-- textarea: длинный вопрос переносится на следующие строки; высота подстраивается под текст (ref fitAsk) -->
      <textarea id="askInput" class="ask-input" rows="1" placeholder="Ваш вопрос…" onChange="{{onAskInput}}" onKeydown="{{onAskKey}}" enterkeyhint="send" ref="{{fitAsk}}">{{askText}}</textarea>
      <button class="{{sendCls}}" onClick="{{sendAsk}}" aria-label="Отправить"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"></path></svg></button>
    </div>
    <div class="hint chat-note">ИИ помогает разобраться, но не заменяет врача</div>
  </div>
</section>
