<!-- Модалка поверх экрана (partials/edit-modal.html). Сохранённое блюдо — так же, как результат разбора при записи. Значения: src/views/meal.js -->
<div class="qmodal-head">
  <div class="qmodal-titles"><h1 class="qmodal-title">Еда</h1><div class="hint">{{mealWhen}}</div></div>
  <button class="icon-btn" onClick="{{closeMeal}}" aria-label="Закрыть"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>

<sc-if value="{{mealMissing}}"><div class="empty-text">Это блюдо уже удалено</div></sc-if>

<sc-if value="{{mealFound}}">
  <div class="gcard g-deep gblock">
    <sc-include name="meal-card"></sc-include>
    <label class="food-note-label" for="mealFix">Уточнить разбор</label>
    <textarea id="mealFix" class="field-input area" rows="2" placeholder="Что поправить?" onChange="{{onFix}}">{{fix}}</textarea>
    <button class="{{fixCls}}" onClick="{{applyFix}}">{{fixLabel}}</button>
  </div>

  <button class="danger-btn" onClick="{{deleteMeal}}">Удалить блюдо</button>
</sc-if>
