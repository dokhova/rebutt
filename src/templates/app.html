<!-- Оболочка приложения. Экраны — src/templates/screens/*.html, значения — src/views/*.js -->
<div class="shell">
  <div class="{{screenCls}}" ref="{{setScrollEl}}">
    <sc-if value="{{is.booting}}"><div class="boot" role="status"><span class="boot-dot"></span>Загружаем ваши данные…</div></sc-if>
    <sc-if value="{{is.legal}}"><sc-include name="legal"></sc-include></sc-if>
    <sc-if value="{{is.meal}}"><sc-include name="meal"></sc-include></sc-if>
    <sc-if value="{{is.entry}}"><sc-include name="entry"></sc-include></sc-if>
    <sc-if value="{{is.water}}"><sc-include name="water"></sc-include></sc-if>
    <sc-if value="{{is.onboarding}}"><sc-include name="onboarding"></sc-include></sc-if>
    <sc-if value="{{is.today}}"><sc-include name="today"></sc-include></sc-if>
    <sc-if value="{{is.insights}}"><sc-include name="insights"></sc-include></sc-if>
    <sc-if value="{{is.profile}}"><sc-include name="profile"></sc-include></sc-if>
  </div>

  <sc-if value="{{showAddSheet}}"><sc-include name="add-sheet"></sc-include></sc-if>

  <sc-if value="{{showTabs}}">
    <div class="tabbar-fade"></div>
    <div class="dock">
    <nav class="tabbar" aria-label="Меню">
      <button class="{{tabToday}}" onClick="{{goToday}}" aria-label="Сегодня">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1z"></path></svg>
      </button>
      <button class="{{tabAdd}}" onClick="{{goAdd}}" aria-label="Новая запись">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
      <button class="{{tabInsights}}" onClick="{{goInsights}}" aria-label="Инсайты">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19h16M7 15v-4M12 15V7M17 15v-6"></path></svg>
      </button>
    </nav>
    <button class="ai-fab" onClick="{{openAssistantDock}}" aria-label="Спросить ИИ">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.9L19 9.7l-5.2 1.8L12 16.4l-1.8-4.9L5 9.7l5.2-1.8z"></path><path d="M18.5 15.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"></path></svg>
    </button>
    </div>
  </sc-if>

  <sc-if value="{{showAssistant}}"><sc-include name="assistant"></sc-include></sc-if>

  <sc-if value="{{showInfo}}"><sc-include name="info-card"></sc-include></sc-if>

  <sc-if value="{{hasToast}}">
    <div class="toast fade-in" role="status">{{toast}}</div>
  </sc-if>
</div>
