<!-- Оболочка приложения. Экраны — src/templates/screens/*.html, значения — src/views/*.js -->
<div class="shell">
  <div class="glow" style="background: {{glowBg}}"></div>

  <div class="{{screenCls}}" ref="{{setScrollEl}}">
    <sc-if value="{{is.onboarding}}"><sc-include name="onboarding"></sc-include></sc-if>
    <sc-if value="{{is.today}}"><sc-include name="today"></sc-include></sc-if>
    <sc-if value="{{is.add}}"><sc-include name="add"></sc-include></sc-if>
    <sc-if value="{{is.insights}}"><sc-include name="insights"></sc-include></sc-if>
    <sc-if value="{{is.profile}}"><sc-include name="profile"></sc-include></sc-if>
  </div>

  <sc-if value="{{showTabs}}">
    <div class="tabbar-fade"></div>
    <nav class="tabbar">
      <button class="{{tabToday}}" onClick="{{goToday}}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"></circle></svg>Сегодня
      </button>
      <button class="{{tabAdd}}" onClick="{{goAdd}}" aria-label="Новая запись">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
      <button class="{{tabInsights}}" onClick="{{goInsights}}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 19V11M12 19V5M19 19v-6"></path></svg>Инсайты
      </button>
    </nav>
  </sc-if>

  <sc-if value="{{hasToast}}">
    <div class="toast fade-in" role="status">{{toast}}</div>
  </sc-if>
</div>
